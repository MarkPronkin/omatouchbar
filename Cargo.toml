[workspace]
resolver = "3"
members = ["crates/t1hw", "crates/core", "crates/daemon", "crates/settings"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Mark Pronkin"]
rust-version = "1.92"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
