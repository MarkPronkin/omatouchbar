<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Touch Bar</title>
  <desc>A laptop keyboard top deck with a glossy black Touch Bar strip, luminous slider control, Touch ID key, and sculpted keycaps.</desc>
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f3f6"/>
      <stop offset="0.82" stop-color="#dcdfe6"/>
      <stop offset="1" stop-color="#c9cdd6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5aab6"/>
      <stop offset="1" stop-color="#878c98"/>
    </linearGradient>
    <linearGradient id="oled" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101115"/>
      <stop offset="1" stop-color="#1e2027"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#62a0ea"/>
    </linearGradient>
    <linearGradient id="keycap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#353841"/>
      <stop offset="1" stop-color="#22242b"/>
    </linearGradient>
  </defs>

  <!-- Grounded shadow and anodized aluminum bottom lip -->
  <rect x="8" y="26" width="112" height="82" rx="16" fill="#000000" opacity="0.22"/>
  <rect x="8" y="24" width="112" height="82" rx="16" fill="url(#edge)"/>

  <!-- Sculpted aluminum top deck -->
  <rect x="8" y="21" width="112" height="82" rx="16" fill="url(#chassis)"/>
  <rect x="8.75" y="21.75" width="110.5" height="80.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.5"/>
  <rect x="8.25" y="21.25" width="111.5" height="84.5" rx="15.75" fill="none" stroke="#101115" stroke-opacity="0.12" stroke-width="0.75"/>

  <!-- Recessed glossy OLED Touch Bar strip -->
  <rect x="16" y="31" width="76" height="28" rx="7" fill="url(#oled)"/>
  <rect x="16" y="31" width="76" height="13" rx="7" fill="url(#glass)"/>

  <!-- Touch Bar controls: Esc cap + luminous slider -->
  <rect x="22" y="38" width="16" height="14" rx="4" fill="#f0f2f6"/>
  <rect x="42" y="38" width="44" height="14" rx="7" fill="#2f333e"/>
  <rect x="42" y="38" width="30" height="14" rx="7" fill="url(#slider)"/>
  <circle cx="65" cy="45.8" r="4.8" fill="#000000" opacity="0.22"/>
  <circle cx="65" cy="45" r="4.8" fill="#ffffff"/>

  <!-- Discrete matte Touch ID sensor key -->
  <rect x="96" y="31" width="16" height="28" rx="6" fill="#181a20"/>
  <rect x="96.75" y="31.75" width="14.5" height="26.5" rx="5.25" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Sculpted top row of MacBook keycaps -->
  <g fill="#101116" opacity="0.28">
    <rect x="16" y="69.5" width="21" height="22" rx="5"/>
    <rect x="41" y="69.5" width="21" height="22" rx="5"/>
    <rect x="66" y="69.5" width="21" height="22" rx="5"/>
    <rect x="91" y="69.5" width="21" height="22" rx="5"/>
  </g>
  <g fill="url(#keycap)">
    <rect x="16" y="68" width="21" height="22" rx="5"/>
    <rect x="41" y="68" width="21" height="22" rx="5"/>
    <rect x="66" y="68" width="21" height="22" rx="5"/>
    <rect x="91" y="68" width="21" height="22" rx="5"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1">
    <rect x="16.5" y="68.5" width="20" height="21" rx="4.5"/>
    <rect x="41.5" y="68.5" width="20" height="21" rx="4.5"/>
    <rect x="66.5" y="68.5" width="20" height="21" rx="4.5"/>
    <rect x="91.5" y="68.5" width="20" height="21" rx="4.5"/>
  </g>
</svg>
